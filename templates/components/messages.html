{{define "messages"}}
{{range .Messages}}
  {{template "message" .}}
{{end}}
{{if not .Messages}}
<div id="empty-state" class="empty-state">
  <img class="empty-mark" src="/static/logo-mark.svg" width="56" height="56" alt="">
  <p class="empty-title">No messages yet</p>
  <p class="empty-copy">Say hello to the room. You will be signed in automatically when you return.</p>
</div>
{{end}}
{{end}}
