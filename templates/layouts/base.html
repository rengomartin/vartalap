{{define "layout"}}<!doctype html>
<html lang="en" class="cds--white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Vartalap — a lightweight anonymous public chat room built with IBM Carbon Design System.">
  <title>{{.Title}} · Vartalap</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/carbon.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <a class="cds--skip-to-content app-skip" href="#app">Skip to content</a>
  <div id="toast-area" aria-live="polite"></div>
  <main id="app" class="app-shell">
    {{template "content" .}}
  </main>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/ws.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>{{end}}
